<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TE AMO - Nuestro Aniversario</title>
    <link rel="stylesheet" href="../css/paginas_styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        /* Estilos específicos para la dinámica final */
        .interactive-zone {
            text-align: center;
            margin-top: 30px;
            position: relative;
        }
        .main-heart {
            font-size: 80px;
            color: #903234;
            cursor: pointer;
            display: inline-block;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 15px rgba(144, 50, 52, 0.6));
            animation: pulse 1.5s infinite;
        }
        .main-heart:hover {
            transform: scale(1.1);
            color: #d32f2f;
        }
        .dynamic-box {
            background: rgba(86, 20, 32, 0.2);
            border: 1px solid rgba(255, 139, 139, 0.2);
            border-radius: 15px;
            padding: 25px 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 25px 0;
            transition: all 0.5s ease;
        }
        .dynamic-message {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            font-style: italic;
            line-height: 1.5;
            margin: 0;
            font-family: 'Georgia', serif;
        }
        .action-btn {
            background: #561420;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(86, 20, 32, 0.4);
        }
        .action-btn:hover {
            background: #3d0c14;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(86, 20, 32, 0.6);
        }
        
        /* Corazones flotantes dinámicos creados con JS */
        .floating-heart {
            position: fixed;
            color: #FF8B8B;
            pointer-events: none;
            z-index: 999;
            animation: fly Up 3s linear forwards;
            opacity: 0.8;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(211, 47, 47, 0.8)); }
            100% { transform: scale(1); }
        }

        @keyframes flyUp {
            0% {
                transform: translateY(100vh) translateX(0) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(var(--random-x)) scale(var(--random-scale));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="content-card">
            
            <a href="../detalle.html" class="back-btn">
                <i class="bi bi-arrow-left-short"></i> Volver al Índice
            </a>

            <div class="card-decor">
                <i class="bi bi-stars text-accent"></i>
            </div>

            <h1 class="page-title" style="color: #FF8B8B;">6. TE AMO</h1>

            <div class="page-content">
                <p class="highlight-text" style="font-size: 18px;">
                    "No importa cuántas veces te lo diga, nunca serán suficientes... Por eso creé este botón para ti."
                </p>

                <div class="interactive-zone">
                    <!-- Corazón palpitante -->
                    <div class="main-heart" id="heartTrigger">
                        <i class="bi bi-heart-fill"></i>
                    </div>

                    <!-- Caja de mensajes cambiantes -->
                    <div class="dynamic-box">
                        <p class="dynamic-message" id="loveMessage">Pulsa el botón o el corazón para descubrir una de las miles de razones...</p>
                    </div>

                    <!-- Botón de acción -->
                    <button class="action-btn" id="btnTrigger">
                        <i class="bi bi-heartbreak-fill" style="display:none;"></i> Presiona aquí
                    </button>
                </div>
            </div>

            <div class="card-footer" style="margin-top: 45px;">
                <i class="bi bi-heart-fill text-accent"></i> Siempre tuya, hoy y cada uno de nuestros días <i class="bi bi-heart-fill text-accent"></i>
            </div>
        </div>
    </div>

    <!-- Lógica dinámica en JavaScript -->
    <script>
        // Array con las mini-razones/mensajes que irán cambiando
        const mensajes = [
            "Te amo por la forma tan bonita en la que miras el futuro y tus metas.",
            "Te amo porque entre tus brazos me siento en el lugar más seguro del mundo.",
            "Te amo por esa 'aura misteriosa' que me cautivó desde el primer momento.",
            "Te amo cuando te conviertes en esa niña consentida que me dan ganas de cuidar siempre.",
            "Te amo por aceptar el caos hermoso que trajimos a la vida de la otra.",
            "Te amo por tu resiliencia, por saber sostener lo nuestro a pesar de la distancia.",
            "Te amo cada vez que te veo disfrutar de una comida rica.",
            "Te amo porque una sola sonrisa tuya me cambia por completo el día.",
            "Te amo por las noches enteras viendo películas y compartiendo silencios cómodos.",
            "Te amo de la nada, intensamente, y con la certeza de que te elegiría en mil vidas más."
        ];

        const heartTrigger = document.getElementById('heartTrigger');
        const btnTrigger = document.getElementById('btnTrigger');
        const loveMessage = document.getElementById('loveMessage');
        let index = 0;

        function triggerLoveEffect() {
            // 1. Cambiar el mensaje de forma secuencial
            loveMessage.style.opacity = 0;
            setTimeout(() => {
                loveMessage.textContent = mensajes[index];
                loveMessage.style.opacity = 1;
                index = (index + 1) % mensajes.length; // Cicla el array
            }, 200);

            // 2. Crear lluvia de corazones flotantes
            for (let i = 0; i < 15; i++) {
                createHeart();
            }
        }

        function createHeart() {
            const heart = document.createElement('i');
            heart.classList.add('bi', 'bi-heart-fill', 'floating-heart');
            
            // Posición e inclinación aleatoria para que se vea natural
            const randomLeft = Math.random() * 100; // Porcentaje de la pantalla
            const randomXOffset = (Math.random() * 200) - 100; // Desplazamiento horizontal en px
            const randomScale = (Math.random() * 1.5) + 0.5; // Tamaños variados
            const randomDuration = (Math.random() * 1.5) + 1.5; // Velocidades variadas

            heart.style.left = `${randomLeft}vw`;
            heart.style.setProperty('--random-x', `${randomXOffset}px`);
            heart.style.setProperty('--random-scale', randomScale);
            
            // Asigna la animación directamente con valores aleatorios
            heart.style.animation = `flyUp ${randomDuration}s ease-out forwards`;
            
            // Variación sutil de color carmín/rosa
            const colors = ['#FF8B8B', '#903234', '#FF5E5E', '#D32F2F'];
            heart.style.color = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(heart);

            // Eliminar el elemento del DOM una vez termine la animación para no saturar
            setTimeout(() => {
                heart.remove();
            }, randomDuration * 1000);
        }

        // Eventos para que funcione clickeando tanto el botón como el corazón gigante
        btnTrigger.addEventListener('click', triggerLoveEffect);
        heartTrigger.addEventListener('click', triggerLoveEffect);
    </script>
</body>
</html>
